<!DOCTYPE html>
<html>
    <head>
        <title>Search Results</title>

        <style>
            body{
                background: #13131a;
                color: #e2e2e8;
                font-family: 'Inter', sans-serif;
                font-size: 14px;
            }
            nav{
                border-bottom: 1px solid #1e1e2e;
                padding: 0 32px;
                display: flex;
                align-items: center;
                height: 56px;
                background: #0f0f16;
            }
            .logo{
                font-size: 18px;
                font-weight: 700;
                color: #fff;
                text-decoration: none;
            }
            .logo spam{
                color: #6366f1;
            }
            .live-badge{
                margin-left: auto;
                background: #1a1a2e;
                color: #6366f1;
                padding: 4px 10px;
                border-radius: 20px;
                font-size: 12px;
                font-weight: 500;
            }
            .container{
                max-width: 680px;
                margin: 0 auto;
                padding: 40px 24px;
            }
            .back-btn{
                background: none;
                border: none;
                color: #6b6b80;
                cursor: pointer;
                font-size: 14px;
                padding: 0;
                margin-bottom: 24px;
                display: flex;
                align-items: center;
                gap: 6px;
                font-family: 'Inter', sans-serif;
                text-decoration: none;
            }
            .back-btn:hover{
                color: #e2e2e8
            }
            h2{
                font-size: 22px;
                font-weight: 700;
                color: #fff;
                margin-bottom: 6px;
            }
            .result-count{
                color: #6b6b80;
                margin-bottom: 28px;
            }
            .results-list{
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .result-card{
                background: #1a1a2e;
                border: 1px solid #2a2a3e;
                border-radius: 8px;
                padding: 14px 18px;
                cursor: pointer;
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-decoration: none;
                transition: border-color 0.15s;
            }
            .result-card:hover{
                border-color: #6366f1;
            }
            .item-name{
                color: #e2e2e8;
                font-weight: 500;
                margin-bottom: 2px;
            }
            .item-id{
                color: #6b6b80;
                font-size: 12px;
            }
            .view-link{
            color: #6366f1;
            font-size: 13px;
            }

            .no-results{
            text-align: center;
            padding: 60px 0;
            color: #6b6b80;
            }

            .no-results h3{
            color: #e2e2e8;
            margin-bottom: 8px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <a href="/" class="back-btn">← Back</a>

            <h2>Results for "{{ query }}"</h2>
            <p class="result-count">{{ results|length }} items found — click to view prices</p>

            {% if results %}
            <div class="results-list">
                {% for item in results %}
                <a href="/prices?id={{item.id}}&name={{item.name}}&server={{server}}" class="result-card">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <img src="https://render.albiononline.com/v1/item/{{item.id}}.png"
                            width="60" height="60"
                            style="border-radius: 6px;">
                        <div>
                            <div class="item-name">{{ item.name }}</div>
                            <div class="item-id">{{ item.id }}</div>
                        </div>
                    </div>
                    <span class="view-link">View prices →</span>
                </a>
                {% endfor %}
            </div>
            {% else %}
            <div class="no-results">
                <h3>No items found</h3>
                <p>Try a different search term</p>
            </div>
            {% endif %}
        </div>
    </body>
</html>
